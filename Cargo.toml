[package]
name        = "dataloader-rs"
version     = "0.2.0"
edition     = "2024"
description = "High-performance DataLoader for Rust with a PyTorch-like interface"
license     = "MIT"
rust-version = "1.95"
repository  = "https://github.com/AzHicham/dataloader-rs"
homepage    = "https://github.com/AzHicham/dataloader-rs"
documentation = "https://docs.rs/dataloader-rs"
readme      = "README.md"
keywords    = ["dataloader", "machine-learning", "pytorch", "batching", "parallel"]
categories  = ["science", "concurrency", "data-structures"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ndarray = ["dep:ndarray"]
torch-rs = ["dep:tch"]
python = ["dep:pyo3", "async", "http", "object-store"]
# AsyncDataset and DataLoader::builder_async: items fetched by futures on tokio.
async = ["dep:tokio", "tokio/time", "dep:futures-util", "dep:bytes"]
# HttpDataset: reqwest over rustls (ring provider, bundled Mozilla roots).
http = ["async", "dep:reqwest", "dep:rustls", "dep:webpki-root-certs"]
# ObjectStoreDataset: S3, GCS, Azure and HTTP stores of the object_store crate, same TLS.
object-store = [
    "async",
    "dep:object_store",
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-root-certs",
]


[profile.release]
opt-level = 3
codegen-units = 1
panic = 'unwind'
lto = "thin"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"

# ── Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.rayon]
version          = "1"
default-features = false

[dependencies.crossbeam-channel]
version          = "0.5"
default-features = false
features         = ["std"]

[dependencies.fastrand]
version          = "2"
default-features = false

# ── Optional Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.tokio]
version          = "1"
default-features = false
features         = ["rt-multi-thread", "sync", "fs", "io-util"]
optional         = true

[dependencies.bytes]
version          = "1"
default-features = false
features         = ["std"]
optional         = true

[dependencies.reqwest]
version          = "0.13"
default-features = false
features         = ["rustls-no-provider"]
optional         = true

# The `*-base` features plus `ring` keep aws-lc out; reqwest's TLS is set above.
[dependencies.object_store]
version          = "0.14"
default-features = false
features         = ["aws-base", "gcp-base", "azure-base", "http-base", "reqwest", "ring"]
optional         = true

[dependencies.rustls]
version          = "0.23"
default-features = false
features         = ["ring", "std", "tls12"]
optional         = true

[dependencies.webpki-root-certs]
version          = "1"
default-features = false
optional         = true

[dependencies.futures-util]
version          = "0.3"
default-features = false
features         = ["alloc"]
optional         = true

[dependencies.ndarray]
version          = "0.17"
default-features = false
optional         = true

[dependencies.tch]
version          = "0.26"
default-features = false
optional         = true

[dependencies.pyo3]
version          = "0.30"
default-features = false
features         = ["macros"]
optional         = true

# ── Dev / benchmark dependencies ──────────────────────────────────────────────

[dev-dependencies.criterion]
version          = "0.8"
default-features = false
features         = ["cargo_bench_support"]

[dev-dependencies.tch]
version          = "0.26"
default-features = false
features         = ["download-libtorch"]

[dev-dependencies.tokio]
version          = "1"
default-features = false
features         = ["macros", "rt-multi-thread", "time", "net", "io-util"]

# TLS server of the HttpDataset tests.
[dev-dependencies.tokio-rustls]
version          = "0.26"
default-features = false
features         = ["ring", "tls12"]

# bench_real_world pins glibc's malloc thresholds (mallopt).
[dev-dependencies.libc]
version          = "0.2"
default-features = false

[[bench]]
name    = "bench_num_workers"
harness = false

[[bench]]
name    = "bench_item_concurrency"
harness = false

[[bench]]
name    = "bench_prefetch_depth"
harness = false

[[bench]]
name    = "bench_batch_size"
harness = false

[[bench]]
name    = "bench_sampler"
harness = false

[[bench]]
name    = "bench_real_world"
harness = false

[[bench]]
name    = "bench_first_batch"
harness = false

[[bench]]
name              = "bench_async"
harness           = false
required-features = ["http"]
