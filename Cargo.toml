[package]
name        = "dataloader-rs"
version     = "0.2.0"
edition     = "2024"
description = "High-performance DataLoader for Rust with a PyTorch-like interface"
license     = "MIT"
rust-version = "1.95"
repository  = "https://github.com/AzHicham/dataloader-rs"
homepage    = "https://github.com/AzHicham/dataloader-rs"
documentation = "https://docs.rs/dataloader-rs"
readme      = "README.md"
keywords    = ["dataloader", "machine-learning", "pytorch", "batching", "parallel"]
categories  = ["science", "concurrency", "data-structures"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ndarray = ["dep:ndarray"]
torch-rs = ["dep:tch"]
# The Python package ships the image pipeline and the data sources.
python = ["dep:pyo3", "image", "sources"]
image = ["dep:image", "dep:half", "dep:fast_image_resize"]
# Data sources: memory, files, plain-HTTP (ureq, pure Rust, no TLS).
sources = ["dep:ureq"]
# https:// for HttpSource, through rustls with its default crypto provider
# (ring), which contains C and assembly. Certificates are checked against the
# bundled Mozilla roots (webpki-roots), not the system store.
sources-tls = ["sources", "ureq/rustls"]


[profile.release]
opt-level = 3
codegen-units = 1
panic = 'unwind'
lto = "thin"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"

# ── Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.rayon]
version          = "1"
default-features = false

[dependencies.crossbeam-channel]
version          = "0.5"
default-features = false
features         = ["std"]

[dependencies.fastrand]
version          = "2"
default-features = false

# ── Optional Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.ndarray]
version          = "0.17"
default-features = false
optional         = true

[dependencies.tch]
version          = "0.26"
default-features = false
optional         = true

[dependencies.pyo3]
version          = "0.30"
default-features = false
features         = ["macros"]
optional         = true

# Pure-Rust decoders only: png, jpeg (zune-jpeg), webp (image-webp); no
# rayon, no C library.
[dependencies.image]
version          = "0.25"
default-features = false
features         = ["png", "jpeg", "webp"]
optional         = true

[dependencies.half]
version          = "2"
default-features = false
optional         = true

# Pure-Rust SIMD resizing; its unsafe stays inside the crate.
[dependencies.fast_image_resize]
version          = "6"
default-features = false
features         = ["std"]
optional         = true

# Blocking HTTP/1.1 client with a connection pool. No default features: no
# TLS (see `sources-tls`), no gzip (responses are not decompressed).
[dependencies.ureq]
version          = "3"
default-features = false
optional         = true

# ── Dev / benchmark dependencies ──────────────────────────────────────────────

[dev-dependencies.criterion]
version          = "0.8"
default-features = false
features         = ["cargo_bench_support"]

[dev-dependencies.tch]
version          = "0.26"
default-features = false
features         = ["download-libtorch"]

# The HTTPS tests of `sources-tls` run a local rustls server; same crypto provider
# (ring) as the client, so no new crate.
[dev-dependencies.rustls]
version          = "0.23"
default-features = false
features         = ["ring", "std"]

# bench_real_world pins glibc's malloc thresholds (mallopt).
[dev-dependencies.libc]
version          = "0.2"
default-features = false

[[bench]]
name    = "bench_num_workers"
harness = false

[[bench]]
name    = "bench_items_in_parallel"
harness = false

[[bench]]
name    = "bench_prefetch_depth"
harness = false

[[bench]]
name    = "bench_batch_size"
harness = false

[[bench]]
name    = "bench_sampler"
harness = false

[[bench]]
name    = "bench_real_world"
harness = false

[[bench]]
name    = "bench_first_batch"
harness = false

[[bench]]
name    = "bench_collate_into"
harness = false

[[bench]]
name              = "bench_image"
harness           = false
required-features = ["image"]

[[bench]]
name              = "bench_sources"
harness           = false
required-features = ["sources", "image"]
