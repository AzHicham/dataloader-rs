[package]
name        = "dataloader-rs"
version     = "0.2.0"
edition     = "2024"
description = "High-performance DataLoader for Rust with a PyTorch-like interface"
license     = "MIT"
rust-version = "1.95"
repository  = "https://github.com/AzHicham/dataloader-rs"
homepage    = "https://github.com/AzHicham/dataloader-rs"
documentation = "https://docs.rs/dataloader-rs"
readme      = "README.md"
keywords    = ["dataloader", "machine-learning", "pytorch", "batching", "parallel"]
categories  = ["science", "concurrency", "data-structures"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
ndarray = ["dep:ndarray"]
torch-rs = ["dep:tch"]
python = ["dep:pyo3", "async", "http", "object-store", "image"]
# AsyncDataset and DataLoader::builder_async: items fetched by futures on tokio.
async = ["dep:tokio", "tokio/time", "dep:futures-util", "dep:bytes", "dep:percent-encoding"]
# HttpDataset: reqwest over rustls (ring provider, bundled Mozilla roots).
http = ["async", "dep:reqwest", "dep:rustls", "dep:webpki-root-certs"]
# ObjectStoreDataset: S3, GCS, Azure and HTTP stores of the object_store crate, same TLS.
object-store = [
    "async",
    "dep:object_store",
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-root-certs",
]
# Image transforms (decode, crop, pad, resize, ...) and ImageCollator: pure-Rust codecs.
image = ["dep:image", "dep:fast_image_resize", "dep:bytes"]


[profile.release]
opt-level = 3
codegen-units = 1
panic = 'unwind'
lto = "thin"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"

# ── Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.rayon]
version          = "1"
default-features = false

[dependencies.crossbeam-channel]
version          = "0.5"
default-features = false
features         = ["std"]

[dependencies.fastrand]
version          = "2"
default-features = false

# ── Optional Runtime dependencies ──────────────────────────────────────────────────────

[dependencies.tokio]
version          = "1"
default-features = false
features         = ["rt-multi-thread", "sync", "fs", "io-util"]
optional         = true

[dependencies.bytes]
version          = "1"
default-features = false
features         = ["std"]
optional         = true

[dependencies.reqwest]
version          = "0.13"
default-features = false
features         = ["rustls-no-provider"]
optional         = true

# The `*-base` features plus `ring` keep aws-lc out; reqwest's TLS is set above.
[dependencies.object_store]
version          = "0.14"
default-features = false
features         = ["aws-base", "gcp-base", "azure-base", "http-base", "reqwest", "ring"]
optional         = true

[dependencies.rustls]
version          = "0.23"
default-features = false
features         = ["ring", "std", "tls12"]
optional         = true

[dependencies.webpki-root-certs]
version          = "1"
default-features = false
optional         = true

[dependencies.futures-util]
version          = "0.3"
default-features = false
features         = ["alloc"]
optional         = true

# Percent-encodes the string values of URL templates (already a dependency of url).
[dependencies.percent-encoding]
version          = "2"
default-features = false
features         = ["alloc"]
optional         = true

[dependencies.ndarray]
version          = "0.17"
default-features = false
optional         = true

[dependencies.tch]
version          = "0.27"
default-features = false
optional         = true

# Pure-Rust decoders only (png, zune-jpeg, image-webp, tiff, bmp): no C library, no rayon.
[dependencies.image]
version          = "0.25"
default-features = false
features         = ["png", "jpeg", "webp", "tiff", "bmp"]
optional         = true

[dependencies.fast_image_resize]
version          = "6"
default-features = false
features         = ["std"]
optional         = true

[dependencies.pyo3]
version          = "0.30"
default-features = false
features         = ["macros"]
optional         = true

# ── Dev / benchmark dependencies ──────────────────────────────────────────────

[dev-dependencies.criterion]
version          = "0.8"
default-features = false
features         = ["cargo_bench_support"]

[dev-dependencies.tch]
version          = "0.27"
default-features = false
features         = ["download-libtorch"]

[dev-dependencies.tokio]
version          = "1"
default-features = false
features         = ["macros", "rt-multi-thread", "time", "net", "io-util"]

# TLS server of the HttpDataset tests.
[dev-dependencies.tokio-rustls]
version          = "0.26"
default-features = false
features         = ["ring", "tls12"]

# Property tests of the location templates.
[dev-dependencies.proptest]
version          = "1"
default-features = false
features         = ["std"]

# bench_real_world pins glibc's malloc thresholds (mallopt).
[dev-dependencies.libc]
version          = "0.2"
default-features = false

[[bench]]
name    = "bench_num_workers"
harness = false

[[bench]]
name    = "bench_item_concurrency"
harness = false

[[bench]]
name    = "bench_prefetch_depth"
harness = false

[[bench]]
name    = "bench_batch_size"
harness = false

[[bench]]
name    = "bench_sampler"
harness = false

[[bench]]
name    = "bench_real_world"
harness = false

[[bench]]
name    = "bench_first_batch"
harness = false

[[bench]]
name              = "bench_image"
harness           = false
required-features = ["image"]

[[bench]]
name              = "bench_async"
harness           = false
required-features = ["http"]

# ── Examples (examples/README.md) ─────────────────────────────────────────────

[[example]]
name = "basic"
path = "examples/rust/basic.rs"

[[example]]
name = "collators"
path = "examples/rust/collators.rs"

[[example]]
name              = "async_dataset"
path              = "examples/rust/async_dataset.rs"
required-features = ["async"]

[[example]]
name              = "http_dataset"
path              = "examples/rust/http_dataset.rs"
required-features = ["http"]

[[example]]
name              = "files_and_objects"
path              = "examples/rust/files_and_objects.rs"
required-features = ["object-store"]

[[example]]
name              = "image_ops"
path              = "examples/rust/image_ops.rs"
required-features = ["image"]

[[example]]
name              = "tiles_by_coordinates"
path              = "examples/rust/tiles_by_coordinates.rs"
required-features = ["http", "image"]

[[example]]
name = "stress_safety"
path = "examples/rust/stress_safety.rs"
