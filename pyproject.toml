[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "dataloader-rs"
version = "0.2.0"
description = "A PyTorch-style DataLoader with a Rust core: worker threads instead of processes"
requires-python = ">=3.13"
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dataloader", "pytorch", "machine-learning", "data-loading", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AzHicham/dataloader-rs"
Documentation = "https://github.com/AzHicham/dataloader-rs/blob/dev/python/README.md"
Benchmarks = "https://github.com/AzHicham/dataloader-rs/blob/dev/BENCH.md"
Changelog = "https://github.com/AzHicham/dataloader-rs/blob/dev/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "numpy==2.5.4",
    "pytest==9.1.1",
    "pytest-benchmark==5.3.0",
    "torch==2.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["B023", "E741"]   # loop variable capture + short lambda arg names are intentional

[tool.ty.environment]
python-version = "3.13"


[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
# Benchmark tests are skipped in regular pytest runs; the bench CI job
# re-enables them explicitly with -m bench --benchmark-enable.
addopts = "-m 'not bench'"
markers = ["bench: mark test as a benchmark (deselected by default)"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "dataloader_rs"
python-source = "."
features = ["python", "pyo3/extension-module"]
# A source build is the fallback where no wheel fits; it must not inherit the
# wheels' x86-64-v3 target, so the sdist leaves the cargo config out.
exclude = [{ path = ".cargo/config.toml", format = "sdist" }]
