[term]
quiet = false          # whether cargo output is quiet
verbose = false        # whether cargo provides verbose output
color = 'auto'         # whether cargo colorizes output
progress.when = 'auto' # whether cargo shows progress bar
progress.width = 80    # width of progress bar

[net]
git-fetch-with-cli = true # whether cargo uses git cli for git fetch

# Linux x86-64 builds, including the published wheels, need an x86-64-v3 CPU
# (AVX2, FMA, BMI2: Intel Haswell 2013+, AMD Zen 2017+). aarch64-apple-darwin
# already targets the Apple M1 (lse, rdm, crc, rcpc, fp16, dotprod, ...).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
