name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lint: prek (drop-in pre-commit replacement written in Rust) ───────────
  pre-commit:
    name: Lint (prek)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1

      # Required by language: system hooks in .pre-commit-config.yaml:
      #   cargo-fmt, cargo-clippy → Rust toolchain
      #   ty                      → ty binary (Python, pre-installed on runner)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - run: pip install ty

      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: "v0.5.7"

      - run: prek run --all-files --show-diff-on-failure

  # ── Rust tests (MSRV + latest stable) ────────────────────────────────────
  test-rust:
    name: Rust tests (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MSRV (1.91)"
            toolchain: "1.91"
          - name: "stable"
            toolchain: stable

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.toolchain }}

      # --all-features builds pyo3, which links libpython. Pin the interpreter
      # instead of using whatever the runner image ships: PYO3_PYTHON also makes
      # pyo3 re-run its build script, so a cached config for another Python
      # (e.g. 3.12 from an older image) is not reused. setup-python exports
      # LD_LIBRARY_PATH so the test binaries find libpython at run time.
      - uses: actions/setup-python@v7.1.0
        id: python
        with:
          python-version: "3.15"

      # On latest stable the rust-version field is irrelevant — strip it so
      # Cargo never rejects a dep update because of a stale MSRV pin.
      - name: Remove rust-version pin (stable only)
        if: matrix.toolchain == 'stable'
        run: sed -i '/^rust-version/d' Cargo.toml

      - name: cargo test
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --all-features

  # ── Python tests (3.14t · 3.15t) ─────────────────────────────────────────
  test-python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14t"
          - python: "3.15t"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: python-${{ matrix.python }}

      # setup-uv understands the `t` suffix and installs the free-threaded build.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Build & install wheel
        run: uv run maturin develop --features python

      - name: pytest
        run: uv run python -X gil=0 -m pytest -v
