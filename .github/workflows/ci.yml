name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Jobs get a read-only token unless they ask for more. The repository's
# default is read/write, which would hand it to every dependency, tool and
# action these jobs run.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Lint: prek (drop-in pre-commit replacement written in Rust) ───────────
  pre-commit:
    name: Lint (prek)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required by language: system hooks in .pre-commit-config.yaml:
      #   cargo-fmt, cargo-clippy → Rust toolchain
      #   ty                      → ty binary (Python, pre-installed on runner)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: pip install ty

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "v0.5.7"

      - run: prek run --all-files --show-diff-on-failure

  # ── Rust tests (MSRV + latest stable, Linux and macOS arm64) ─────────────
  test-rust:
    name: Rust tests (${{ matrix.name }})
    runs-on: ${{ matrix.os || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "MSRV (1.95)"
            toolchain: "1.95"
          - name: "stable"
            toolchain: stable
          - name: "stable, macOS arm64"
            toolchain: stable
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.toolchain }}-${{ runner.os }}

      # --all-features builds pyo3, which links libpython. Pin the interpreter
      # instead of using whatever the runner image ships: PYO3_PYTHON also makes
      # pyo3 re-run its build script, so a cached config for another Python
      # (e.g. 3.12 from an older image) is not reused. setup-python exports
      # LD_LIBRARY_PATH so the test binaries find libpython at run time.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.15"

      # tch's download-libtorch looks for a PyPI wheel name that PyTorch does not
      # publish for macOS arm64, so tch links the libtorch of the torch wheel
      # instead. Keep the version equal to tch's libtorch (torch-sys
      # TORCH_VERSION) and to the torch pin in pyproject.toml. The test binaries
      # find libtorch and libpython through DYLD_LIBRARY_PATH.
      - name: Install libtorch from the torch wheel (macOS)
        if: runner.os == 'macOS'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install torch==2.15.0
          LIBTORCH="$("$PYTHON" -c 'import pathlib, torch; print(pathlib.Path(torch.__file__).parent)')"
          LIBPYTHON="$("$PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "LIBTORCH=$LIBTORCH" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$LIBTORCH/lib:$LIBPYTHON" >> "$GITHUB_ENV"

      # On latest stable the rust-version field is irrelevant — strip it so
      # Cargo never rejects a dep update because of a stale MSRV pin.
      # (-i.bak works with both GNU and BSD sed.)
      - name: Remove rust-version pin (stable only)
        if: matrix.toolchain == 'stable'
        run: sed -i.bak '/^rust-version/d' Cargo.toml && rm Cargo.toml.bak

      - name: cargo test
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --all-features

  # ── Python tests (3.11 · 3.12 · 3.13 · 3.14 · 3.15 · 3.14t · 3.15t) ──────
  # ── plus 3.12 on macOS arm64 ─────────────────────────────────────────────
  test-python:
    name: Python tests (${{ matrix.python }}${{ matrix.os && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every interpreter with a wheel. On the GIL builds the workers take
          # turns running Python code, which the free-threaded builds never do.
          - python: "3.11"
          - python: "3.12"
          - python: "3.13"
          - python: "3.14"
          - python: "3.15"
          - python: "3.14t"
          - python: "3.15t"
          - python: "3.12"
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: python-${{ matrix.python }}-${{ runner.os }}

      # setup-uv understands the `t` suffix and installs the free-threaded build.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Build & install wheel
        run: uv run maturin develop --features python

      # -X gil=0 keeps the GIL off on free-threaded builds; GIL builds have no such flag.
      - name: pytest
        run: uv run python ${{ endsWith(matrix.python, 't') && '-X gil=0' || '' }} -m pytest -v
