name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rc

# Only one release at a time — prevents race conditions on shared resources
# (git tags, crates.io, PyPI).
concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-26.04
    permissions:
      contents: write       # create tags and GitHub releases
      issues: write         # comment on released issues
      pull-requests: write  # comment on released PRs
      id-token: write       # OIDC provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use a PAT so that the release commit created by semantic-release
          # triggers subsequent workflows (GITHUB_TOKEN commits do not).
          persist-credentials: false

      # semantic-release-cargo updates Cargo.toml + Cargo.lock with the new
      # version number as part of the release prepare step.
      - name: Install semantic-release-cargo
        uses: EricCrosson/install-github-release-binary@679a6508ba13bc1eac11e387f729a8bc421ac07a # v2
        with:
          targets: semantic-release-cargo/semantic-release-cargo@v2.2.30

      # semantic-release 25 and its changelog and git plugins need Node.js
      # 22.22.2+ or 24.15+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Like the release builds, restore no cache.
          package-manager-cache: false

      # npx rather than cycjimmy/semantic-release-action, which warns on every
      # release that the repository has no package.json: its only way to
      # silence that, skip_npm_plugin, replaces the plugins in .releaserc.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.SCOPED_GITHUB_TOKEN }}
          # None of these packages needs an install script.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          # Dry-run on dev: analyze commits and report the next version without
          # creating tags, GitHub releases, or pushing anything.
          DRY_RUN: ${{ github.ref_name == 'dev' }}
        # The conventionalcommits preset stays on 9.x: 10 needs
        # conventional-changelog-writer 9, and the release notes generator of
        # semantic-release 25 still loads writer 8.
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/git@11.0.1
          -p @semantic-release/exec@7.1.0
          -p conventional-changelog-conventionalcommits@9.3.1
          -p @saithodev/semantic-release-backmerge@4.0.1
          semantic-release --dry-run="$DRY_RUN"
