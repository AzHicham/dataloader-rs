name: Publish

on:
  release:
    types: [published]
  push:
    branches: [dev]
  # Build every wheel before merging a change to packaging or to this workflow.
  # Uploads stay release-only (publish-pypi; publish-crates is a dry run here).
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/publish.yml
      - Cargo.toml
      - pyproject.toml

# Jobs get a read-only token unless they ask for more. The repository's
# default is read/write, which would hand it to every dependency, tool and
# action these jobs run.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build Python wheels (always — validates compilation on dev too) ───────
  # 15 combinations: 3 platforms × CPython 3.13, 3.14, 3.15 (GIL) and
  # free-threaded 3.14t, 3.15t. One wheel per interpreter rather than abi3:
  # the limited API is slower on the per-batch paths, and has no free-threaded
  # form.
  build-wheels:
    name: Wheel (${{ matrix.platform.target }}, ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15", "3.14t", "3.15t"]
        platform:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-15
            target: aarch64-apple-darwin
            macos_target: "11.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Release builds start clean: a tag run restores caches saved on the
      # default branch, which any dev-only tool or dependency could write.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'release'
        with:
          key: publish-${{ matrix.platform.target }}-${{ matrix.python }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # On macOS maturin runs natively — install the free-threaded interpreter
      # via uv (setup-python does not provide free-threaded builds).
      # On Linux maturin runs inside the manylinux container which already
      # ships the interpreters; no host-side Python setup is needed.
      - name: Install Python (macOS only)
        if: runner.os == 'macOS'
        run: uv python install ${{ matrix.python }}

      - name: Resolve interpreter path (macOS only)
        if: runner.os == 'macOS'
        id: pypath
        run: echo "path=$(uv python find ${{ matrix.python }})" >> $GITHUB_OUTPUT

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || '' }}
          args: >-
            --release --features python --out dist
            --interpreter ${{ runner.os == 'macOS' && steps.pypath.outputs.path || matrix.python }}
          sccache: ${{ github.event_name != 'release' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.macos_target || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl

  # ── Source distribution: other interpreters and platforms build from it ──
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      # Named like the wheels so that publish-pypi picks it up with them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI — real releases only ─────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-26.04
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  # ── crates.io dry run — everything but releases ──────────────────────────
  check-crate:
    name: Package the crate (dry run)
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Package and build the crate without uploading. cargo only warns that
      # the current version already exists. publish-crates' own dry-run skips
      # `cargo publish` entirely, and its consistency check always fails on
      # dev: the version is only bumped by semantic-release at release.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  # ── Publish to crates.io — real releases only ────────────────────────────
  # The `crates-io` environment holds the deployment until a maintainer
  # approves it, and only deploys version tags. Like publish-pypi, it waits
  # for every Python artifact, so a release that fails to build reaches
  # neither registry.
  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    needs: [build-wheels, build-sdist]
    environment: crates-io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
